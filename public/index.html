<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Convert Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <span class="logo">QC</span>
    <div>
      <h1>Quick Convert Pro</h1>
      <p>Batch video, audio, image &amp; data conversion &middot; powered by ffmpeg</p>
    </div>
  </header>

  <main>
    <section id="drop" class="drop">
      <input id="file" type="file" multiple hidden />
      <div class="drop-inner">
        <div class="drop-icon">&#8645;</div>
        <p><strong>Drop files here</strong> or click to browse</p>
        <p class="muted">You can select many files at once</p>
      </div>
    </section>

    <ul id="list" class="list"></ul>

    <section class="history">
      <h2>Recent conversions</h2>
      <ul id="history"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
