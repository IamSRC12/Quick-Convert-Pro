<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Convert Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('qcp-theme') || 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <header>
    <span class="logo">QC</span>
    <div class="head-text">
      <h1>Quick Convert Pro</h1>
      <p>Batch video, audio, image &amp; data conversion &middot; powered by ffmpeg</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle light / dark theme" aria-label="Toggle theme">
      <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>
  </header>

  <main>
    <section id="drop" class="drop">
      <input id="file" type="file" multiple hidden />
      <div class="drop-inner">
        <div class="drop-icon">&#8645;</div>
        <p><strong>Drop files here</strong> or click to browse</p>
        <p class="muted">You can select many files at once</p>
      </div>
    </section>

    <ul id="list" class="list"></ul>

    <section class="history">
      <h2>Recent conversions</h2>
      <ul id="history"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
